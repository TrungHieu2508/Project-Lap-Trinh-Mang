<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giám sát máy tính qua mạng</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="LOGO.jpg" type="image/x-icon">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <img src="LOGO.jpg" alt="Logo" class="logo">
    </div>

    <nav class="menu">
      <a href="#" class="active">GIÁM SÁT</a>
      <a href="#">1</a>
      <a href="#">2</a>
    </nav>

    <div class="actions">
      <div class="chip">BLOCK</div>
      <div class="chip">ADD</div>
    </div>

    <div class="user">
      <div class="avatar"></div>
      <div>
        <div class="role">Admin</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="title">GIAM SAT MAY TINH QUA MANG</div>
      <a href="log in.html">
        <button class="login-btn">Log in</button>
      </a>
    </header>

    <section>
      <p class="hint">Chọn máy cần giám sát — click để phóng to / mở giám sát</p>

      <div class="grid" id="grid">
        <div class="card" data-id="1" data-link="#">
          <div class="thumb"><div class="placeholder">MAY 1 PREVIEW</div></div>
          <div class="card-label">
            <div>May 1</div><button class="open-btn">Phóng to</button>
          </div>
        </div>

        <div class="card" data-id="2" data-link="#">
          <div class="thumb"><div class="placeholder">MAY 2 PREVIEW</div></div>
          <div class="card-label">
            <div>May 2</div><button class="open-btn">Phóng to</button>
          </div>
        </div>

        <div class="card" data-id="3" data-link="#">
          <div class="thumb"><div class="placeholder">MAY 3 PREVIEW</div></div>
          <div class="card-label">
            <div>May 3</div><button class="open-btn">Phóng to</button>
          </div>
        </div>

        <div class="card" data-id="6" data-link="#">
          <div class="thumb"><div class="placeholder">MAY 6 PREVIEW</div></div>
          <div class="card-label">
            <div>May 6</div><button class="open-btn">Phóng to</button>
          </div>
        </div>

        <div class="card" data-id="8" data-link="#">
          <div class="thumb"><div class="placeholder">MAY 8 PREVIEW</div></div>
          <div class="card-label">
            <div>May 8</div><button class="open-btn">Phóng to</button>
          </div>
        </div>

        <div class="card" data-id="0" data-link="#">
          <div class="thumb"><div class="placeholder">MAY 9 PREVIEW</div></div>
          <div class="card-label">
            <div>May 9</div><button class="open-btn">Phóng to</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
